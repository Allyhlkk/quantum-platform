{% extends "formulas/formulas_base.html" %}
{% block content %}
<div class="formula-panel">
  <div class="formula-block">
    <h3>Quantum Coherence ($l_1$-norm)</h3>
    $$C_{l_1}(\rho) = \sum_{i \neq j} |\rho_{ij}|$$
  </div>
  <div class="formula-bound">
    <span>量子相干性描述了状态在给定基组下的叠加性质。对于 Werner 态，随着噪声 $p$ 的减小，非对角线元素逐渐消失，相干性也随之下降。</span>
  </div>
</div>

<div class="card analysis-panel">
  <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Werner态相干性扫描 (1D Scan)</h2>
      <button id="load-btn" onclick="loadCoherenceData()" class="btn-primary">▶ 生成曲线</button>
  </div>
  <div id="plot-coherence-1d" style="width: 100%; height: 400px;"></div>
</div>

<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<script>
function loadCoherenceData() {
    fetch("/analysis/api/coherence_scan").then(res => res.json()).then(data => {
        const trace = { 
            x: data.p, 
            y: data.coherence, 
            type: 'scatter', 
            mode: 'lines',
            line: {color: '#9467BD', width: 3} 
        };
        Plotly.newPlot('plot-coherence-1d', [trace], { 
            title: 'Coherence vs p', 
            xaxis: {title: 'p (权重)'}, 
            yaxis: {title: 'l1-norm Coherence'} 
        });
    });
}
</script>
{% endblock %}
