<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>量子纠缠分析与可视化平台</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/effects.css">
    <link rel="stylesheet" href="/static/ui_enhance.css">
    <style>
        .formula-replay-dock {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 2600;
            width: min(360px, calc(100vw - 24px));
            background: rgba(14, 11, 33, 0.94);
            border: 1px solid rgba(123, 108, 246, 0.4);
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42), inset 0 0 18px rgba(123, 108, 246, 0.12);
            backdrop-filter: blur(8px);
            padding: 10px;
        }

        .dock-collapsible {
            transform: translateX(calc(100% - 32px));
            transition: transform 0.25s ease;
        }

        .dock-collapsible:hover,
        .dock-collapsible:focus-within {
            transform: translateX(0);
        }

        .dock-tab {
            position: absolute;
            left: -32px;
            top: 50%;
            width: 32px;
            height: 96px;
            border-radius: 10px 0 0 10px;
            background: rgba(123, 108, 246, 0.22);
            border: 1px solid rgba(123, 108, 246, 0.4);
            border-right: none;
            color: #e6e0ff;
            font-size: 12px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            transform: translateY(-50%);
        }

        .projection-mode .state-control-panel,
        .projection-mode .formula-replay-dock {
            display: none;
        }

        .projection-mode .aurora-bg,
        .projection-mode #bg-canvas {
            display: none;
        }

        body {
            zoom: 0.85;
        }

        @media (max-width: 900px) {
            body {
                zoom: 0.9;
            }
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(123, 108, 246, 0.45) rgba(255, 255, 255, 0.06);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(123, 108, 246, 0.45);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(123, 108, 246, 0.7);
        }

        .formula-replay-title {
            font-size: 12px;
            letter-spacing: 1px;
            color: #cfc8ff;
            margin-bottom: 8px;
        }

        .formula-replay-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .formula-replay-row:last-child {
            margin-bottom: 0;
        }

        .formula-replay-row label {
            margin: 0;
            font-size: 12px;
            color: #bdb5ea;
            min-width: 62px;
        }

        .formula-replay-row select,
        .formula-replay-row button {
            margin-top: 0;
            height: 30px;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid rgba(123, 108, 246, 0.36);
            background: rgba(123, 108, 246, 0.12);
            color: #eee9ff;
            font-size: 12px;
            cursor: pointer;
        }

        .formula-replay-row select {
            flex: 1;
            min-width: 0;
        }

        .formula-replay-status {
            font-size: 12px;
            color: #aee1ff;
            min-height: 18px;
            margin-top: 2px;
            line-height: 1.4;
        }

        .kq-explain-flash {
            animation: kq-explain-flash 0.9s ease;
        }

        @keyframes kq-explain-flash {
            0% { box-shadow: 0 0 0 rgba(255, 120, 180, 0); background: rgba(255, 120, 180, 0); }
            35% { box-shadow: 0 0 18px rgba(255, 120, 180, 0.35); background: rgba(255, 120, 180, 0.09); }
            100% { box-shadow: 0 0 0 rgba(255, 120, 180, 0); background: rgba(255, 120, 180, 0); }
        }

        @media (max-width: 900px) {
            .formula-replay-dock {
                left: 8px;
                right: 8px;
                bottom: 8px;
                width: auto;
            }
            .dock-collapsible {
                transform: none;
            }
            .dock-tab {
                display: none;
            }
        }

        .state-control-panel {
            position: fixed;
            right: 16px;
            top: 16px;
            z-index: 2500;
            width: min(320px, calc(100vw - 24px));
            background: rgba(10, 12, 26, 0.92);
            border: 1px solid rgba(123, 108, 246, 0.42);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .state-control-title {
            font-size: 12px;
            letter-spacing: 1px;
            color: #cfc8ff;
            margin-bottom: 8px;
        }

        .state-control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .state-control-row:last-child {
            margin-bottom: 0;
        }

        .state-control-row label {
            margin: 0;
            font-size: 12px;
            color: #bdb5ea;
            min-width: 44px;
        }

        .state-control-row select,
        .state-control-row input[type="range"] {
            flex: 1;
            min-width: 0;
        }

        .state-control-row select {
            height: 30px;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid rgba(210, 214, 255, 0.55);
            background: linear-gradient(180deg, rgba(34, 38, 68, 0.98), rgba(18, 20, 38, 0.96));
            color: #f7f6ff;
            font-size: 12px;
        }

        .state-control-row select:focus,
        .state-control-row select:hover {
            border-color: rgba(255, 214, 102, 0.7);
            box-shadow: 0 0 0 2px rgba(255, 214, 102, 0.18);
            outline: none;
        }

        .state-control-row select option {
            background: #141728;
            color: #f0efff;
        }

        .state-control-row span {
            font-size: 12px;
            color: #aee1ff;
            min-width: 48px;
            text-align: right;
        }

        @media (max-width: 900px) {
            .state-control-panel {
                left: 8px;
                right: 8px;
                top: 8px;
                width: auto;
            }
        }
    </style>
</head>
<body data-module="{{ module_name | default('formula') }}">
<div id="global-loadbar" class="global-loadbar"></div>
<div class="aurora-bg"></div>
<canvas id="bg-canvas"></canvas>

<main class="container">
    {% block content %}{% endblock %}
</main>

<div id="state-control-panel" class="state-control-panel dock-collapsible">
    <div class="dock-tab">态切换</div>
    <div class="state-control-title">量子态设置</div>
    <div class="state-control-row">
        <label for="state-type">态类型</label>
        <select id="state-type">
            <option value="werner">Werner 态（噪声 p）</option>
            <option value="generalized">广义 Werner（p, θ）</option>
            <option value="bell">Bell 态 |Ψ-></option>
            <option value="pure_theta">纯态 |ψ(θ)></option>
        </select>
    </div>
    <div class="state-control-row" id="state-theta-row">
        <label for="state-theta">角度 θ</label>
        <input id="state-theta" type="range" min="0" max="1.5708" step="0.01" value="0.7854">
        <span id="state-theta-text">0.79</span>
    </div>
</div>

<div id="formula-replay-dock" class="formula-replay-dock dock-collapsible">
    <div class="dock-tab">参数回放</div>
    <div class="formula-replay-title">参数回放（教学演示）</div>
    <div class="formula-replay-row">
        <label for="formula-replay-target">目标参数</label>
        <select id="formula-replay-target"></select>
    </div>
    <div class="formula-replay-row">
        <label for="formula-replay-speed">回放速度</label>
        <select id="formula-replay-speed">
            <option value="0.5">慢速 x0.5</option>
            <option value="1" selected>标准 x1</option>
            <option value="2">快速 x2</option>
            <option value="3">高速 x3</option>
        </select>
    </div>
    <div class="formula-replay-row">
        <button id="formula-replay-play" type="button">开始回放</button>
        <button id="formula-replay-refresh" type="button">刷新参数列表</button>
    </div>
    <div class="formula-replay-status" id="formula-replay-status">就绪。</div>
</div>

<footer class="footer">
    © Quantum Information Graduation Project
</footer>

<script src="{{ url_for('static', filename='particles.js') }}"></script>
<script src="{{ url_for('static', filename='ui_enhance.js') }}"></script>

<script>
(function () {
    const panel = document.getElementById('state-control-panel');
    const typeSel = document.getElementById('state-type');
    const thetaRow = document.getElementById('state-theta-row');
    const thetaInput = document.getElementById('state-theta');
    const thetaText = document.getElementById('state-theta-text');
    if (!panel || !typeSel || !thetaRow || !thetaInput || !thetaText) return;

    const callbacks = [];
    const storage = window.localStorage;
    const storedType = storage ? storage.getItem('kq_state_type') : null;
    const storedTheta = storage ? storage.getItem('kq_state_theta') : null;

    if (storedType && Array.from(typeSel.options).some(opt => opt.value === storedType)) {
        typeSel.value = storedType;
    }
    if (storedTheta && !Number.isNaN(Number(storedTheta))) {
        thetaInput.value = String(Number(storedTheta));
    }

    function needsTheta(type) {
        return type === 'generalized' || type === 'pure_theta';
    }

    function getType() {
        return typeSel.value || 'werner';
    }

    function getTheta() {
        const val = Number(thetaInput.value);
        if (!Number.isFinite(val)) return Math.PI / 4;
        return Math.min(Math.max(val, 0), Math.PI / 2);
    }

    function sync() {
        const type = getType();
        thetaRow.style.display = needsTheta(type) ? 'flex' : 'none';
        thetaText.textContent = getTheta().toFixed(2);
    }

    function emitChange() {
        callbacks.forEach(cb => cb());
        autoTriggerLoad();
    }

    let autoLoadTimer = null;
    function autoTriggerLoad() {
        if (autoLoadTimer) window.clearTimeout(autoLoadTimer);
        autoLoadTimer = window.setTimeout(() => {
            if (typeof window.FormulaAutoLoad === "function") {
                window.FormulaAutoLoad();
                return;
            }
            const btn = document.getElementById("load-btn");
            if (btn && !btn.disabled) btn.click();
        }, 0);
    }

    function query(extra) {
        const params = new URLSearchParams();
        if (extra) {
            Object.entries(extra).forEach(([key, value]) => {
                if (value !== undefined && value !== null && value !== '') {
                    params.set(key, String(value));
                }
            });
        }
        const type = getType();
        params.set('state_type', type);
        if (needsTheta(type)) {
            params.set('theta', getTheta().toFixed(4));
        }
        return params.toString();
    }

    function buildUrl(base, extra) {
        const qs = query(extra);
        return qs ? `${base}?${qs}` : base;
    }

    window.FormulaState = {
        getType,
        getTheta,
        query,
        buildUrl,
        onChange(callback) {
            if (typeof callback === 'function') {
                callbacks.push(callback);
            }
        },
        sync,
    };

    typeSel.addEventListener('change', () => {
        if (storage) storage.setItem('kq_state_type', getType());
        sync();
        emitChange();
    });

    thetaInput.addEventListener('input', () => {
        if (storage) storage.setItem('kq_state_theta', String(getTheta()));
        sync();
        emitChange();
    });

    sync();
})();
</script>

{% block extra_js %}{% endblock %}

<script>
(function () {
    const dock = document.getElementById('formula-replay-dock');
    const targetSel = document.getElementById('formula-replay-target');
    const speedSel = document.getElementById('formula-replay-speed');
    const playBtn = document.getElementById('formula-replay-play');
    const refreshBtn = document.getElementById('formula-replay-refresh');
    const statusEl = document.getElementById('formula-replay-status');
    if (!dock || !targetSel || !speedSel || !playBtn || !refreshBtn || !statusEl) return;

    let rangeInputs = [];
    let timer = null;
    let direction = 1;

    function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#ff9ea6' : '#aee1ff';
    }

    function normalizeLabel(el, idx) {
        const idOrName = (el.id || el.name || `param_${idx + 1}`).trim();
        let label = '';
        if (el.id) {
            const byFor = document.querySelector(`label[for="${el.id}"]`);
            if (byFor && byFor.textContent) label = byFor.textContent.trim();
        }
        if (!label) {
            const wrapLabel = el.closest('label');
            if (wrapLabel && wrapLabel.textContent) label = wrapLabel.textContent.trim();
        }
        if (!label) label = idOrName;
        return `${label} (${idOrName})`;
    }

    function collectRanges() {
        rangeInputs = Array.from(document.querySelectorAll('input[type="range"]'))
            .filter(el => !el.disabled && el.offsetParent !== null && !dock.contains(el));

        targetSel.innerHTML = '';
        if (!rangeInputs.length) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '本页没有可回放滑条';
            targetSel.appendChild(opt);
            playBtn.disabled = true;
            setStatus('未检测到 range 滑条。', true);
            return;
        }

        rangeInputs.forEach((el, idx) => {
            const opt = document.createElement('option');
            opt.value = String(idx);
            opt.textContent = normalizeLabel(el, idx);
            targetSel.appendChild(opt);
        });
        playBtn.disabled = false;
        setStatus(`已检测到 ${rangeInputs.length} 个可回放参数。`);
    }

    function getTargetRange() {
        const idx = Number(targetSel.value || 0);
        return rangeInputs[idx] || null;
    }

    function parseNum(v, fallback) {
        const x = Number(v);
        return Number.isFinite(x) ? x : fallback;
    }

    function highlightExplanation() {
        const hit = document.querySelector('[id*="guide"], [id*="interpret"], [id*="explain"], .analysis-conclusion');
        if (!hit) return;
        const panel = hit.closest('.card') || hit;
        panel.classList.remove('kq-explain-flash');
        void panel.offsetWidth;
        panel.classList.add('kq-explain-flash');
    }

    function fireInput(el) {
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
        highlightExplanation();
    }

    function stepPlayback() {
        const el = getTargetRange();
        if (!el) {
            stopPlayback();
            setStatus('当前目标参数不可用。', true);
            return;
        }

        const min = parseNum(el.min, 0);
        const max = parseNum(el.max, 1);
        const baseStep = Math.abs(parseNum(el.step, (max - min) / 100 || 0.01));
        const speed = Math.max(0.2, parseNum(speedSel.value, 1));
        const delta = baseStep * speed * direction;

        let next = parseNum(el.value, min) + delta;
        if (next >= max) {
            next = max;
            direction = -1;
        } else if (next <= min) {
            next = min;
            direction = 1;
        }

        const decimals = baseStep >= 1 ? 0 : Math.min(6, String(baseStep).split('.')[1]?.length || 2);
        el.value = String(next.toFixed(decimals));
        fireInput(el);

        setStatus(`回放中：${normalizeLabel(el, targetSel.selectedIndex)} = ${el.value}`);
    }

    function startPlayback() {
        if (timer) return;
        const el = getTargetRange();
        if (!el) {
            setStatus('请选择可用参数后再开始。', true);
            return;
        }
        direction = 1;
        timer = window.setInterval(stepPlayback, 140);
        playBtn.textContent = '暂停回放';
        setStatus('回放已启动。');
    }

    function stopPlayback() {
        if (!timer) return;
        window.clearInterval(timer);
        timer = null;
        playBtn.textContent = '开始回放';
        setStatus('回放已暂停。');
    }

    playBtn.addEventListener('click', () => {
        if (timer) stopPlayback();
        else startPlayback();
    });

    refreshBtn.addEventListener('click', () => {
        stopPlayback();
        collectRanges();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopPlayback();
    });

    window.addEventListener('beforeunload', stopPlayback);
    window.addEventListener('load', collectRanges);
    collectRanges();
})();
</script>

window.MathJax = {

</body>
