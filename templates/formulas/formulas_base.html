<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>量子纠缠分析与可视化平台</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/effects.css">
    <link rel="stylesheet" href="/static/ui_enhance.css">
    <style>
        .formula-replay-dock {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 2600;
            width: min(360px, calc(100vw - 24px));
            background: rgba(14, 11, 33, 0.94);
            border: 1px solid rgba(123, 108, 246, 0.4);
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42), inset 0 0 18px rgba(123, 108, 246, 0.12);
            backdrop-filter: blur(8px);
            padding: 10px;
        }

        .formula-replay-title {
            font-size: 12px;
            letter-spacing: 1px;
            color: #cfc8ff;
            margin-bottom: 8px;
        }

        .formula-replay-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .formula-replay-row:last-child {
            margin-bottom: 0;
        }

        .formula-replay-row label {
            margin: 0;
            font-size: 12px;
            color: #bdb5ea;
            min-width: 62px;
        }

        .formula-replay-row select,
        .formula-replay-row button {
            margin-top: 0;
            height: 30px;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid rgba(123, 108, 246, 0.36);
            background: rgba(123, 108, 246, 0.12);
            color: #eee9ff;
            font-size: 12px;
            cursor: pointer;
        }

        .formula-replay-row select {
            flex: 1;
            min-width: 0;
        }

        .formula-replay-status {
            font-size: 12px;
            color: #aee1ff;
            min-height: 18px;
            margin-top: 2px;
            line-height: 1.4;
        }

        .kq-explain-flash {
            animation: kq-explain-flash 0.9s ease;
        }

        @keyframes kq-explain-flash {
            0% { box-shadow: 0 0 0 rgba(255, 120, 180, 0); background: rgba(255, 120, 180, 0); }
            35% { box-shadow: 0 0 18px rgba(255, 120, 180, 0.35); background: rgba(255, 120, 180, 0.09); }
            100% { box-shadow: 0 0 0 rgba(255, 120, 180, 0); background: rgba(255, 120, 180, 0); }
        }

        @media (max-width: 900px) {
            .formula-replay-dock {
                left: 8px;
                right: 8px;
                bottom: 8px;
                width: auto;
            }
        }
    </style>
</head>
<body data-module="{{ module_name | default('formula') }}">
<div id="global-loadbar" class="global-loadbar"></div>
<div class="aurora-bg"></div>
<canvas id="bg-canvas"></canvas>

<main class="container">
    {% block content %}{% endblock %}
</main>

<div id="formula-replay-dock" class="formula-replay-dock">
    <div class="formula-replay-title">参数回放（教学演示）</div>
    <div class="formula-replay-row">
        <label for="formula-replay-target">目标参数</label>
        <select id="formula-replay-target"></select>
    </div>
    <div class="formula-replay-row">
        <label for="formula-replay-speed">回放速度</label>
        <select id="formula-replay-speed">
            <option value="0.5">慢速 x0.5</option>
            <option value="1" selected>标准 x1</option>
            <option value="2">快速 x2</option>
            <option value="3">高速 x3</option>
        </select>
    </div>
    <div class="formula-replay-row">
        <button id="formula-replay-play" type="button">开始回放</button>
        <button id="formula-replay-refresh" type="button">刷新参数列表</button>
    </div>
    <div class="formula-replay-status" id="formula-replay-status">就绪。</div>
</div>

<footer class="footer">
    © Quantum Information Graduation Project
</footer>

<script src="{{ url_for('static', filename='particles.js') }}"></script>
<script src="{{ url_for('static', filename='ui_enhance.js') }}"></script>

{% block extra_js %}{% endblock %}

<script>
(function () {
    const dock = document.getElementById('formula-replay-dock');
    const targetSel = document.getElementById('formula-replay-target');
    const speedSel = document.getElementById('formula-replay-speed');
    const playBtn = document.getElementById('formula-replay-play');
    const refreshBtn = document.getElementById('formula-replay-refresh');
    const statusEl = document.getElementById('formula-replay-status');
    if (!dock || !targetSel || !speedSel || !playBtn || !refreshBtn || !statusEl) return;

    let rangeInputs = [];
    let timer = null;
    let direction = 1;

    function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#ff9ea6' : '#aee1ff';
    }

    function normalizeLabel(el, idx) {
        const idOrName = (el.id || el.name || `param_${idx + 1}`).trim();
        let label = '';
        if (el.id) {
            const byFor = document.querySelector(`label[for="${el.id}"]`);
            if (byFor && byFor.textContent) label = byFor.textContent.trim();
        }
        if (!label) {
            const wrapLabel = el.closest('label');
            if (wrapLabel && wrapLabel.textContent) label = wrapLabel.textContent.trim();
        }
        if (!label) label = idOrName;
        return `${label} (${idOrName})`;
    }

    function collectRanges() {
        rangeInputs = Array.from(document.querySelectorAll('input[type="range"]'))
            .filter(el => !el.disabled && el.offsetParent !== null && !dock.contains(el));

        targetSel.innerHTML = '';
        if (!rangeInputs.length) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '本页没有可回放滑条';
            targetSel.appendChild(opt);
            playBtn.disabled = true;
            setStatus('未检测到 range 滑条。', true);
            return;
        }

        rangeInputs.forEach((el, idx) => {
            const opt = document.createElement('option');
            opt.value = String(idx);
            opt.textContent = normalizeLabel(el, idx);
            targetSel.appendChild(opt);
        });
        playBtn.disabled = false;
        setStatus(`已检测到 ${rangeInputs.length} 个可回放参数。`);
    }

    function getTargetRange() {
        const idx = Number(targetSel.value || 0);
        return rangeInputs[idx] || null;
    }

    function parseNum(v, fallback) {
        const x = Number(v);
        return Number.isFinite(x) ? x : fallback;
    }

    function highlightExplanation() {
        const hit = document.querySelector('[id*="guide"], [id*="interpret"], [id*="explain"], .analysis-conclusion');
        if (!hit) return;
        const panel = hit.closest('.card') || hit;
        panel.classList.remove('kq-explain-flash');
        void panel.offsetWidth;
        panel.classList.add('kq-explain-flash');
    }

    function fireInput(el) {
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
        highlightExplanation();
    }

    function stepPlayback() {
        const el = getTargetRange();
        if (!el) {
            stopPlayback();
            setStatus('当前目标参数不可用。', true);
            return;
        }

        const min = parseNum(el.min, 0);
        const max = parseNum(el.max, 1);
        const baseStep = Math.abs(parseNum(el.step, (max - min) / 100 || 0.01));
        const speed = Math.max(0.2, parseNum(speedSel.value, 1));
        const delta = baseStep * speed * direction;

        let next = parseNum(el.value, min) + delta;
        if (next >= max) {
            next = max;
            direction = -1;
        } else if (next <= min) {
            next = min;
            direction = 1;
        }

        const decimals = baseStep >= 1 ? 0 : Math.min(6, String(baseStep).split('.')[1]?.length || 2);
        el.value = String(next.toFixed(decimals));
        fireInput(el);

        setStatus(`回放中：${normalizeLabel(el, targetSel.selectedIndex)} = ${el.value}`);
    }

    function startPlayback() {
        if (timer) return;
        const el = getTargetRange();
        if (!el) {
            setStatus('请选择可用参数后再开始。', true);
            return;
        }
        direction = 1;
        timer = window.setInterval(stepPlayback, 140);
        playBtn.textContent = '暂停回放';
        setStatus('回放已启动。');
    }

    function stopPlayback() {
        if (!timer) return;
        window.clearInterval(timer);
        timer = null;
        playBtn.textContent = '开始回放';
        setStatus('回放已暂停。');
    }

    playBtn.addEventListener('click', () => {
        if (timer) stopPlayback();
        else startPlayback();
    });

    refreshBtn.addEventListener('click', () => {
        stopPlayback();
        collectRanges();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopPlayback();
    });

    window.addEventListener('beforeunload', stopPlayback);
    window.addEventListener('load', collectRanges);
    collectRanges();
})();
</script>

<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

</body>
</html>
