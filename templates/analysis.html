{% extends "base.html" %}

{% block content %}
<div class="analysis-layout">
    <!-- ========== 左侧：分析列表 ========== -->
    <aside class="analysis-sidebar card">
        <div class="card-title">分析列表</div>
        
        <div class="anal-group">
            <div class="anal-group-title">纠缠结构分析</div>
            <ul class="anal-list">
                <li class="anal-item" onclick="loadAnalysis('/analysis/formula/schmidt')">
                    Schmidt 分解
                </li>
            </ul>
        </div>
        
        <div class="anal-group">
            <div class="anal-group-title">非定域性判据</div>
            <ul class="anal-list">
                <li class="anal-item" onclick="loadAnalysis('/analysis/formula/chsh')">
                    CHSH 不等式
                </li>
            </ul>
        </div>
        
        <div class="anal-group disabled">
            <div class="anal-group-title">混合态判据（规划）</div>
            <ul class="anal-list">
                <li class="anal-item disabled">PPT 判据</li>
            </ul>
        </div>
    </aside>

    <!-- ========== 右侧：分析操作区 ========== -->
    <section class="analysis-workspace card">
        <div class="card-title">分析操作区</div>
        <iframe 
            id="analysis-frame" 
            src="/analysis/formula/schmidt" 
            frameborder="0" 
            class="analysis-frame">
        </iframe>
    </section>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 点击左侧列表切换 iframe
function loadAnalysis(url) {
    const frame = document.getElementById("analysis-frame");
    frame.src = url;
}

// 自动调整 iframe 高度
function resizeIframe() {
    const frame = document.getElementById("analysis-frame");
    if (!frame) return;
    
    const topOffset = frame.getBoundingClientRect().top;
    const windowHeight = window.innerHeight;
    frame.style.height = (windowHeight - topOffset - 20) + "px"; // 20px margin
}

// 页面加载和窗口调整都要触发
window.addEventListener("load", resizeIframe);
window.addEventListener("resize", resizeIframe);
</script>
{% endblock %}
